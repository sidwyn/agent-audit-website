name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json (pnpm@10.2.1).
      # Don't also set `version:` here; pnpm/action-setup@v4 errors on both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the workspace dependency so downstream packages (report) can
      # resolve "@agentaudit/audit" types from its emitted dist/.
      - run: pnpm --filter @agentaudit/audit build

      # Unit tests are pure (no browser); the Playwright checkout probe is gated
      # behind SMOKE_STORE_URL and skipped in CI.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
