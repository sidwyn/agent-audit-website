  - agent: claude
    model: Claude Opus 4.8
    task: Buy a product and reach the payment step
    steps:
      - Live claude run via automation/CDP-controlled Chrome (not the Claude for Chrome extension).
      - "Furthest stage reached: homepage (blocked at the network edge)."
      - "Blocker: Cloudflare bot protection — \"Sorry, you have been blocked\" on first load."
    outcome: abandoned
    failure_stage: discovery
    blockerCode: cloudflare_challenge
    notes: Automation/CDP-driven browser was blocked by Ridge's Cloudflare bot check
      before any store content loaded — did not solve or bypass it. A human-driven
      browser (the Gemini run) gets through.
    obstacles:
      - { key: captcha_cloudflare_bot, hit: true, note: "\"Sorry, you have been blocked\" on first request; not bypassed" }
    checks:
      - { section: homepage, key: nav, status: blocked, note: Cloudflare block before any content }
      - { section: homepage, key: search_box, status: blocked }
      - { section: homepage, key: categories, status: blocked }
    screenshots:
      - claude-1-homepage.png
